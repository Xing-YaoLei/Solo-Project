version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: legal_postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: legal_admin
      POSTGRES_PASSWORD: legal_secret_2024
      POSTGRES_DB: legal_delegation
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legal_admin -d legal_delegation"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: legal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass legal_redis_2024 --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "legal_redis_2024", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
