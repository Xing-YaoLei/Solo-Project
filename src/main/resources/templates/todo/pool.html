<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="zh-CN">
<head>
  <title>待办池</title>
</head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="page-header__title">待办池</h1>
  </div>

  <div class="alert alert--danger" th:if="${error}" th:text="${error}"></div>
  <div class="alert alert--success" th:if="${success}" th:text="${success}"></div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">筛选条件</h2>
    </div>
    <div class="card__body">
      <form class="form form--inline" th:action="@{/todos}" method="get">
        <div class="form-group">
          <label class="form-group__label" for="todoType">待办类型</label>
          <select class="form-group__input" id="todoType" name="todoType">
            <option value="" th:selected="${selectedType == null}">全部</option>
            <option value="MISSING_DOCUMENT" th:selected="${selectedType != null and selectedType.name() == 'MISSING_DOCUMENT'}" th:if="${currentRole == 'ASSESSOR' or currentRole == 'FINANCE' or currentRole == 'MANAGER'}">资料缺失</option>
            <option value="PREPARATION_OVERDUE" th:selected="${selectedType != null and selectedType.name() == 'PREPARATION_OVERDUE'}" th:if="${currentRole == 'ASSESSOR' or currentRole == 'MANAGER'}">整备逾期</option>
            <option value="LISTING_REMINDER" th:selected="${selectedType != null and selectedType.name() == 'LISTING_REMINDER'}" th:if="${currentRole == 'SALES' or currentRole == 'MANAGER'}">上架提醒</option>
            <option value="PRICE_ADJUSTMENT" th:selected="${selectedType != null and selectedType.name() == 'PRICE_ADJUSTMENT'}" th:if="${currentRole == 'SALES' or currentRole == 'MANAGER'}">调价建议</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-group__label" for="status">状态</label>
          <select class="form-group__input" id="status" name="status">
            <option value="" th:selected="${selectedStatus == null}">全部</option>
            <option value="PENDING" th:selected="${selectedStatus != null and selectedStatus.name() == 'PENDING'}">待处理</option>
            <option value="PROCESSING" th:selected="${selectedStatus != null and selectedStatus.name() == 'PROCESSING'}">处理中</option>
            <option value="DONE" th:selected="${selectedStatus != null and selectedStatus.name() == 'DONE'}">已完成</option>
          </select>
        </div>
        <div class="form-group" th:if="${currentRole == 'MANAGER'}">
          <label class="form-group__label" for="assigneeId">负责人</label>
          <select class="form-group__input" id="assigneeId" name="assigneeId">
            <option value="" th:selected="${selectedAssigneeId == null}">全部</option>
            <option th:each="user : ${assignees}"
                    th:value="${user.id}"
                    th:selected="${selectedAssigneeId != null and selectedAssigneeId == user.id}"
                    th:text="${user.realName}">负责人</option>
          </select>
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn--primary">搜索</button>
          <a class="btn btn--secondary" th:href="@{/todos}">重置</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">待办列表</h2>
    </div>
    <div class="card__body">
      <table class="table" th:if="${todos != null and !todos.isEmpty()}">
        <thead>
          <tr>
            <th>车辆信息</th>
            <th>待办类型</th>
            <th>状态</th>
            <th>标题</th>
            <th>负责人</th>
            <th>截止日期</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="todo : ${todos}"
              th:classappend="${todo.overdue} ? 'row--danger' : ''">
            <td>
              <a th:href="@{/vehicles/{id}(id=${todo.vehicleId})}" th:text="${todo.vehicleInfo}">车辆</a>
            </td>
            <td><span th:replace="~{fragments/common :: statusBadge(${todo.todoType})}">类型</span></td>
            <td><span th:replace="~{fragments/common :: statusBadge(${todo.status})}">状态</span></td>
            <td th:text="${todo.title}">标题</td>
            <td th:text="${todo.assigneeName}">负责人</td>
            <td>
              <span th:text="${todo.dueDate}">截止日期</span>
              <span class="badge badge--danger" th:if="${todo.overdue}">逾期</span>
            </td>
            <td>
              <div class="btn-group">
                <form th:action="@{/todos/{id}/process(id=${todo.id})}" method="post"
                      th:if="${todo.status == 'PENDING'}" style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <button type="submit" class="btn btn--sm btn--primary">处理</button>
                </form>
                <form th:action="@{/todos/{id}/complete(id=${todo.id})}" method="post"
                      th:if="${todo.status == 'PROCESSING'}" style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <button type="submit" class="btn btn--sm btn--success">完成</button>
                </form>
                <form th:action="@{/todos/{id}/reject(id=${todo.id})}" method="post"
                      th:if="${todo.status == 'PROCESSING'}" style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <input class="form-group__input" type="text" name="remark" placeholder="退回原因" style="display:inline;width:auto">
                  <button type="submit" class="btn btn--sm btn--danger">退回</button>
                </form>
                <form th:action="@{/todos/{id}/reassign(id=${todo.id})}" method="post"
                      th:if="${currentRole == 'MANAGER'}" style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <select class="form-group__input" name="newAssigneeId" style="display:inline;width:auto">
                    <option value="">选择负责人</option>
                    <option th:each="user : ${assignees}"
                            th:value="${user.id}"
                            th:text="${user.realName}">负责人</option>
                  </select>
                  <button type="submit" class="btn btn--sm btn--secondary">改负责人</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:if="${todos == null or todos.isEmpty()}">
        <div th:replace="~{fragments/common :: emptyState('暂无待办事项')}"></div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/common :: pagination(${todos})}"></div>

</div>
</body>
</html>
