default: &default
  adapter: postgresql
  encoding: unicode
  host: localhost
  port: 5432
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000
  schema_search_path: "public"
  variables:
    statement_timeout: 30s
    lock_timeout: 10s

development:
  <<: *default
  database: compliance_audit_development
  username: <%= ENV.fetch("DB_USERNAME") { `whoami`.chomp } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

test:
  <<: *default
  database: compliance_audit_test
  username: <%= ENV.fetch("DB_USERNAME") { `whoami`.chomp } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>

production:
  <<: *default
  database: compliance_audit_production
  username: <%= ENV.fetch("DB_USERNAME") { "" } %>
  password: <%= ENV.fetch("DB_PASSWORD") { "" } %>
  host: <%= ENV.fetch("DB_HOST") { "localhost" } %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 20 } %>
