<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('试驾详情 - 二手车试驾预约系统')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">试驾详情 - <span th:text="${appointment.customerName}"></span></h3>
        <a th:href="@{/records}" class="btn btn-outline-secondary">返回列表</a>
    </div>

    <div class="row">
        <div class="col-md-4">
            <div class="card">
                <div class="card-header">预约时段信息</div>
                <div class="card-body">
                    <table class="table table-sm">
                        <tr><th style="width:100px">客户姓名</th><td th:text="${appointment.customerName}"></td></tr>
                        <tr><th>联系电话</th><td th:text="${appointment.customerPhone}"></td></tr>
                        <tr><th>试驾车辆</th><td th:text="${appointment.vehicleName}"></td></tr>
                        <tr><th>车辆编号</th><td th:text="${appointment.vehicleId}"></td></tr>
                        <tr><th>预约日期</th><td th:text="${appointment.appointmentDate}"></td></tr>
                        <tr><th>预约时段</th><td th:text="${appointment.appointmentTime}"></td></tr>
                        <tr><th>销售顾问</th><td th:text="${appointment.salesConsultant?.realName}"></td></tr>
                        <tr><th>预约状态</th>
                            <td><span class="status-badge" th:class="'status-' + ${appointment.status.name()}" th:text="${appointment.status.name()}"></span></td>
                        </tr>
                        <tr><th>备注</th><td th:text="${appointment.appointmentRemark}"></td></tr>
                    </table>
                    <div class="mt-3">
                        <a th:href="@{/scheduler/edit/{id}(id=${appointment.id})}" class="btn btn-sm btn-outline-primary">编辑预约</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>试驾记录</span>
                    <span>
                        <a th:if="${record == null}" th:href="@{/records/{id}/record/new(id=${appointment.id})}" class="btn btn-sm btn-primary">新建</a>
                        <a th:if="${record != null}" th:href="@{/records/{id}/record/edit(id=${appointment.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                    </span>
                </div>
                <div class="card-body">
                    <div th:if="${record == null}" class="text-center text-muted py-4">
                        暂无试驾记录
                    </div>
                    <div th:if="${record != null}">
                        <table class="table table-sm">
                            <tr><th style="width:100px">开始时间</th><td th:text="${#temporals.format(record.startTime, 'yyyy-MM-dd HH:mm')}"></td></tr>
                            <tr><th>结束时间</th><td th:text="${record.endTime != null} ? ${#temporals.format(record.endTime, 'yyyy-MM-dd HH:mm')} : '进行中'"></td></tr>
                            <tr><th>起始里程</th><td th:text="${record.startMileage}"></td></tr>
                            <tr><th>结束里程</th><td th:text="${record.endMileage}"></td></tr>
                            <tr><th>陪驾人</th><td th:text="${record.driver?.realName}"></td></tr>
                            <tr><th>试驾路线</th><td th:text="${record.routeDescription}"></td></tr>
                            <tr><th>备注</th><td th:text="${record.remark}"></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>试驾反馈</span>
                    <a th:if="${feedback == null}" th:href="@{/records/{id}/feedback/new(id=${appointment.id})}" class="btn btn-sm btn-primary">新建</a>
                </div>
                <div class="card-body">
                    <div th:if="${feedback == null}" class="text-center text-muted py-4">
                        暂无试驾反馈
                    </div>
                    <div th:if="${feedback != null}">
                        <table class="table table-sm">
                            <tr><th style="width:100px">总体评分</th>
                                <td><span class="rating-stars" th:each="i : ${#numbers.sequence(1, feedback.overallRating)}">&#9733;</span></td>
                            </tr>
                            <tr><th>舒适度</th>
                                <td><span class="rating-stars" th:each="i : ${#numbers.sequence(1, feedback.vehicleComfortRating)}">&#9733;</span></td>
                            </tr>
                            <tr><th>性能</th>
                                <td><span class="rating-stars" th:each="i : ${#numbers.sequence(1, feedback.vehiclePerformanceRating)}">&#9733;</span></td>
                            </tr>
                            <tr><th>服务</th>
                                <td><span class="rating-stars" th:each="i : ${#numbers.sequence(1, feedback.salesServiceRating)}">&#9733;</span></td>
                            </tr>
                            <tr><th>购买意向</th><td th:text="${feedback.purchaseIntent?.name()}"></td></tr>
                            <tr><th>满意点</th><td th:text="${feedback.likes}"></td></tr>
                            <tr><th>不满意点</th><td th:text="${feedback.dislikes}"></td></tr>
                            <tr><th>客户评论</th><td th:text="${feedback.customerComment}"></td></tr>
                            <tr><th>销售评价</th><td th:text="${feedback.salesComment}"></td></tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div class="row mt-4" th:if="${appointment.lead != null}">
        <div class="col-12">
            <a th:href="@{/records/lead/{id}(id=${appointment.lead.id})}" class="btn btn-outline-info">查看该客户全部试驾历史</a>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
