version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: home_measure
      POSTGRES_PASSWORD: home_measure_pass
      POSTGRES_DB: home_measure_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg://home_measure:home_measure_pass@db:5432/home_measure_db
      - REDIS_URL=redis://redis:6379/0

  celery_worker:
    build: ./backend
    command: celery -A app.tasks.worker worker --loglevel=info
    volumes:
      - ./backend:/app
    depends_on:
      - db
      - redis
    environment:
      - DATABASE_URL=postgresql+psycopg://home_measure:home_measure_pass@db:5432/home_measure_db
      - REDIS_URL=redis://redis:6379/0

  frontend:
    build: ./frontend
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
