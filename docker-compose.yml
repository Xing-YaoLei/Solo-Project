version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: legal-fee-postgres
    environment:
      POSTGRES_DB: legal_fee
      POSTGRES_USER: legal_user
      POSTGRES_PASSWORD: legal_pass_2024
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: legal-fee-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
