<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('变更历史 - ' + ${lead.customerName})}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">变更历史 - <span th:text="${lead.customerName}"></span></h3>
        <a th:href="@{/leads/{id}(id=${lead.id})}" class="btn btn-outline-secondary">返回详情</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(changeLogs)}" class="text-center text-muted py-4">暂无变更记录</div>
            <div th:each="log : ${changeLogs}" class="change-log-item mb-3">
                <div class="row">
                    <div class="col-md-2">
                        <div class="change-log-field" th:text="${log.fieldName}"></div>
                        <div class="small text-muted" th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm')}"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="small text-muted">修改前</label>
                        <div class="change-log-old" th:text="${log.oldValue} ?: '（空）'"></div>
                    </div>
                    <div class="col-md-1 text-center align-self-center">
                        <span class="h4">&rarr;</span>
                    </div>
                    <div class="col-md-3">
                        <label class="small text-muted">修改后</label>
                        <div class="change-log-new" th:text="${log.newValue} ?: '（空）'"></div>
                    </div>
                    <div class="col-md-3">
                        <label class="small text-muted">操作人</label>
                        <div th:text="${log.operator?.realName} ?: '系统'"></div>
                        <div th:if="${log.changeReason}" class="small text-muted mt-1" th:text="${log.changeReason}"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
