<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('客户线索 - 二手车试驾预约系统')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">客户线索管理</h3>
        <a th:href="@{/leads/new}" class="btn btn-primary">新增线索</a>
    </div>

    <div class="card mb-4">
        <div class="card-body">
            <form th:action="@{/leads}" th:object="${query}" method="get" class="row g-3">
                <div class="col-md-2">
                    <label class="form-label">客户姓名</label>
                    <input type="text" th:field="*{customerName}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">电话</label>
                    <input type="text" th:field="*{phone}" class="form-control">
                </div>
                <div class="col-md-2">
                    <label class="form-label">状态</label>
                    <select th:field="*{status}" class="form-select">
                        <option value="">全部</option>
                        <option th:each="s : ${statuses}" th:value="${s.name()}" th:text="${s.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">来源</label>
                    <select th:field="*{source}" class="form-select">
                        <option value="">全部</option>
                        <option th:each="s : ${sources}" th:value="${s.name()}" th:text="${s.name()}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">负责人</label>
                    <select th:field="*{ownerId}" class="form-select">
                        <option value="">全部</option>
                        <option th:each="o : ${owners}" th:value="${o.id}" th:text="${o.realName}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <label class="form-label">起始日期</label>
                    <input type="date" th:field="*{startDate}" class="form-control">
                </div>
                <div class="col-12">
                    <button type="submit" class="btn btn-primary">搜索</button>
                    <a th:href="@{/leads}" class="btn btn-outline-secondary">重置</a>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>客户姓名</th>
                    <th>电话</th>
                    <th>意向车型</th>
                    <th>来源</th>
                    <th>负责人</th>
                    <th>状态</th>
                    <th>创建时间</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="lead : ${leads}">
                    <td th:text="${lead.customerName}"></td>
                    <td th:text="${lead.phone}"></td>
                    <td th:text="${lead.intendedVehicle}"></td>
                    <td th:text="${lead.source?.name()}"></td>
                    <td th:text="${lead.owner?.realName}"></td>
                    <td><span class="status-badge" th:class="'lead-status-' + ${lead.status.name()}" th:text="${lead.status.name()}"></span></td>
                    <td th:text="${#temporals.format(lead.createTime, 'yyyy-MM-dd HH:mm')}"></td>
                    <td>
                        <a th:href="@{/leads/{id}(id=${lead.id})}" class="btn btn-sm btn-outline-info">详情</a>
                        <a th:href="@{/leads/edit/{id}(id=${lead.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                        <a th:href="@{/leads/{id}/history(id=${lead.id})}" class="btn btn-sm btn-outline-secondary">变更</a>
                        <a th:href="@{/scheduler/new(leadId=${lead.id})}" class="btn btn-sm btn-outline-success">预约</a>
                        <a th:href="@{/leads/delete/{id}(id=${lead.id})}" class="btn btn-sm btn-outline-danger"
                           onclick="return confirm('确定删除吗？')">删除</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(leads)}">
                    <td colspan="8" class="text-center text-muted py-4">暂无数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
