version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: ticket-dashboard-db
    environment:
      POSTGRES_USER: ticket_dashboard
      POSTGRES_PASSWORD: ticket_dashboard_pwd
      POSTGRES_DB: ticket_dashboard
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticket_dashboard -d ticket_dashboard"]
      interval: 5s
      timeout: 5s
      retries: 5

  supabase-mock:
    image: postgres:15-alpine
    container_name: ticket-dashboard-supabase
    environment:
      POSTGRES_USER: supabase
      POSTGRES_PASSWORD: supabase_pwd
      POSTGRES_DB: postgres
    ports:
      - "5433:5432"
    volumes:
      - supabase_data:/var/lib/postgresql/data

volumes:
  postgres_data:
  supabase_data:
