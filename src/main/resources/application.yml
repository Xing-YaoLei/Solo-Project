server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/usedcar_db?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  thymeleaf:
    cache: false
    prefix: classpath:/templates/
    suffix: .html
    encoding: UTF-8
    mode: HTML

  data:
    redis:
      host: localhost
      port: 6379

  quartz:
    job-store-type: memory
