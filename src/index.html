<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>二手车门店过户材料调度解谜游戏</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Microsoft YaHei', 'PingFang SC', sans-serif;
        }
        #application-canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .ui-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }
        .ui-overlay > * {
            pointer-events: auto;
        }
    </style>
</head>
<body>
    <canvas id="application-canvas"></canvas>
    <div id="ui-root" class="ui-overlay"></div>
    <script src="/ammo.js"></script>
</body>
</html>
