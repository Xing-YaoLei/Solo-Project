<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物业装修备案调度</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            overflow: hidden;
        }
        .loading {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            transition: opacity 0.5s ease;
        }
        .loading.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .logo {
            font-size: 48px;
            margin-bottom: 16px;
            animation: bounce 2s ease-in-out infinite;
        }
        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }
        .title {
            font-size: 32px;
            font-weight: bold;
            color: #fff;
            margin-bottom: 8px;
        }
        .subtitle {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 40px;
        }
        .progress-wrap {
            width: 280px;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 12px;
        }
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #4a90d9, #52c41a);
            border-radius: 4px;
            transition: width 0.3s ease;
        }
        .progress-text {
            font-size: 12px;
            color: rgba(255, 255, 255, 0.5);
        }
        #game-container {
            position: fixed;
            inset: 0;
            width: 100%;
            height: 100%;
        }
        #game-container iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
    </style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="logo">🏢</div>
        <h1 class="title">物业装修备案调度</h1>
        <p class="subtitle">模拟经营解谜游戏 · Godot 4 Web 版</p>
        <div class="progress-wrap">
            <div class="progress-bar" id="progressBar"></div>
        </div>
        <p class="progress-text" id="progressText">正在加载游戏引擎...</p>
    </div>
    
    <div id="game-container">
        <iframe id="gameFrame" src="build/web/index.html" onload="onGameLoaded()"></iframe>
    </div>

    <script>
        let loadProgress = 0;
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');
        const loading = document.getElementById('loading');

        function updateProgress(text) {
            progressText.textContent = text;
            loadProgress = Math.min(loadProgress + 15, 90);
            progressBar.style.width = loadProgress + '%';
        }

        const checks = [
            { t: 300, m: '初始化 WebGL 渲染器...' },
            { t: 800, m: '加载游戏资源...' },
            { t: 1500, m: '编译 GDScript...' },
            { t: 2500, m: '准备物业备案数据...' },
            { t: 4000, m: '即将进入游戏...' }
        ];

        checks.forEach(c => setTimeout(() => updateProgress(c.m), c.t));

        function onGameLoaded() {
            setTimeout(() => {
                progressBar.style.width = '100%';
                progressText.textContent = '加载完成！';
                setTimeout(() => {
                    loading.classList.add('hidden');
                }, 400);
            }, 800);
        }

        setTimeout(() => {
            if (!loading.classList.contains('hidden')) {
                loading.classList.add('hidden');
            }
        }, 15000);
    </script>
</body>
</html>
