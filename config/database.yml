default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  username: <%= ENV.fetch("PGUSER") { "postgres" } %>
  password: <%= ENV.fetch("PGPASSWORD") { "" } %>
  host: <%= ENV.fetch("PGHOST") { "localhost" } %>
  port: <%= ENV.fetch("PGPORT") { 5432 } %>

development:
  <<: *default
  database: mp0164_development

test:
  <<: *default
  database: mp0164_test

production:
  <<: *default
  database: mp0164_production
  username: mp0164
  password: <%= ENV["MP0164_DATABASE_PASSWORD"] %>
