<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('试驾记录 - 二手车试驾预约系统')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <h3 class="section-title mb-4">试驾记录列表</h3>

    <div class="card">
        <div class="card-body">
            <table class="table table-hover">
                <thead>
                <tr>
                    <th>预约日期</th>
                    <th>时段</th>
                    <th>客户</th>
                    <th>车辆</th>
                    <th>预约状态</th>
                    <th>试驾记录</th>
                    <th>客户反馈</th>
                    <th>操作</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="appt : ${appointments}">
                    <td th:text="${appt.appointmentDate}"></td>
                    <td th:text="${appt.appointmentTime}"></td>
                    <td th:text="${appt.customerName}"></td>
                    <td th:text="${appt.vehicleName}"></td>
                    <td><span class="status-badge" th:class="'status-' + ${appt.status.name()}" th:text="${appt.status.name()}"></span></td>
                    <td>
                        <span class="badge bg-success" th:if="${appt.status.name() == 'COMPLETED'}">已填写</span>
                        <span class="badge bg-secondary" th:unless="${appt.status.name() == 'COMPLETED'}">待填写</span>
                    </td>
                    <td>
                        <span class="badge bg-success" th:if="${appt.status.name() == 'COMPLETED'}">已反馈</span>
                        <span class="badge bg-secondary" th:unless="${appt.status.name() == 'COMPLETED'}">待反馈</span>
                    </td>
                    <td>
                        <a th:href="@{/records/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-primary">详情</a>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(appointments)}">
                    <td colspan="8" class="text-center text-muted py-4">暂无数据</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
