<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('通知中心')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">通知中心</h3>
        <a th:href="@{/no-show}" class="btn btn-outline-secondary">返回</a>
    </div>

    <div class="card">
        <div class="card-body">
            <div th:if="${#lists.isEmpty(notifications)}" class="text-center text-muted py-4">暂无通知</div>
            <div th:each="n : ${notifications}" class="change-log-item mb-3"
                 th:style="${n.readFlag} ? '' : 'background-color:#fff3cd;'">
                <div class="d-flex justify-content-between">
                    <div>
                        <span class="badge"
                              th:classappend="${n.type.name() == 'NO_SHOW'} ? 'bg-danger' : 'bg-primary'"
                              th:text="${n.type.name()}"></span>
                        <strong class="ms-2" th:text="${n.title}"></strong>
                        <span th:if="${!n.readFlag}" class="badge bg-warning text-dark ms-2">未读</span>
                    </div>
                    <div class="d-flex gap-2">
                        <span class="text-muted small" th:text="${#temporals.format(n.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                        <form th:if="${!n.readFlag}" th:action="@{/no-show/notifications/{id}/read(id=${n.id})}" method="post">
                            <button type="submit" class="btn btn-sm btn-outline-secondary">标记已读</button>
                        </form>
                    </div>
                </div>
                <div class="mt-2" th:text="${n.content}"></div>
                <div th:if="${n.relatedId != null}" class="mt-1">
                    <a th:href="@{/no-show/{id}(id=${n.relatedId})}" class="btn btn-sm btn-outline-primary">查看详情</a>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
