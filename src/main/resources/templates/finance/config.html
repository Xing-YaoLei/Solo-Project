<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="zh-CN">
<head>
  <title>金融资料配置</title>
</head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="page-header__title">金融资料配置</h1>
  </div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">筛选条件</h2>
    </div>
    <div class="card__body">
      <form class="form form--inline" th:action="@{/finance/config}" method="get">
        <div class="form-group">
          <label class="form-group__label" for="vehicleId">车辆ID</label>
          <input class="form-group__input" type="text" id="vehicleId" name="vehicleId"
                 th:value="${param.vehicleId != null ? param.vehicleId[0] : ''}" placeholder="车辆ID">
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn--primary">搜索</button>
          <a class="btn btn--secondary" th:href="@{/finance/config}">重置</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card" th:if="${currentRole == 'FINANCE' or currentRole == 'MANAGER'}">
    <div class="card__header">
      <h2 class="card__title">上传资料</h2>
    </div>
    <div class="card__body">
      <form class="form" th:action="@{/finance/documents}" method="post">
        <div class="grid grid--3">
          <div class="form-group">
            <label class="form-group__label" for="documentType">资料类型</label>
            <select class="form-group__input" id="documentType" name="documentType" required>
              <option value="">请选择</option>
              <option value="LOAN_APPLICATION">贷款申请</option>
              <option value="INSURANCE">保险</option>
              <option value="GUARANTEE">担保函</option>
              <option value="OTHER">其他</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="documentUrl">资料链接</label>
            <input class="form-group__input" type="url" id="documentUrl" name="documentUrl" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-group__label" for="remark">备注</label>
          <textarea class="form-group__input" id="remark" name="remark" rows="3"></textarea>
        </div>
        <input type="hidden" name="vehicleId" th:value="${param.vehicleId != null ? param.vehicleId[0] : ''}">
        <input type="hidden" name="uploaderId" th:value="${currentUserId}">
        <button type="submit" class="btn btn--primary">提交</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">资料列表</h2>
    </div>
    <div class="card__body">
      <table class="table" th:if="${documents != null and !documents.isEmpty()}">
        <thead>
          <tr>
            <th>车辆信息</th>
            <th>资料类型</th>
            <th>资料链接</th>
            <th>状态</th>
            <th>上传人</th>
            <th>审核时间</th>
            <th>备注</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="doc : ${documents}">
            <td>
              <a th:href="@{/vehicles/{id}(id=${doc.vehicleId})}" th:text="${doc.vehicleInfo}">车辆</a>
            </td>
            <td th:text="${doc.documentType}">类型</td>
            <td>
              <a th:href="${doc.documentUrl}" th:text="${doc.documentUrl}" target="_blank">链接</a>
            </td>
            <td>
              <span class="badge"
                    th:classappend="${doc.status == 'MISSING'} ? 'badge--danger' : (${doc.status == 'PENDING'} ? 'badge--warning' : (${doc.status == 'APPROVED'} ? 'badge--success' : 'badge--danger')"
                    th:text="${doc.status}">状态</span>
            </td>
            <td th:text="${doc.uploaderName}">上传人</td>
            <td th:text="${doc.reviewedAt}">审核时间</td>
            <td th:text="${doc.remark}">备注</td>
            <td>
              <div class="btn-group"
                   th:if="${(currentRole == 'FINANCE' or currentRole == 'MANAGER') and doc.status == 'PENDING'}">
                <form th:action="@{/finance/documents/{id}/approve(id=${doc.id})}" method="post"
                      style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <button type="submit" class="btn btn--sm btn--success">通过</button>
                </form>
                <form th:action="@{/finance/documents/{id}/reject(id=${doc.id})}" method="post"
                      style="display:inline">
                  <input type="hidden" name="operatorId" th:value="${currentUserId}">
                  <input class="form-group__input" type="text" name="remark" placeholder="退回原因" style="display:inline;width:auto">
                  <button type="submit" class="btn btn--sm btn--danger">退回</button>
                </form>
              </div>
            </td>
          </tr>
        </tbody>
      </table>

      <div th:if="${documents == null or documents.isEmpty()}">
        <div th:replace="~{fragments/common :: emptyState('暂无金融资料')}"></div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/common :: pagination(${documents})}"></div>

</div>
</body>
</html>
