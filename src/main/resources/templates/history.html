<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>状态变更历史 - 青少年培训续费跟进排程台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="bg-light">

<div th:insert="~{layout/fragments :: header}"></div>

<div class="d-flex">
    <div th:insert="~{layout/fragments :: sidebar}"></div>

    <main class="flex-grow-1 p-4">
        <div th:insert="~{layout/fragments :: pageHeader('状态变更历史', '全业务线状态变更审计记录')}"></div>

        <div class="card border-0 shadow-sm rounded-4 mb-4">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-3"><i class="bi bi-funnel me-2"></i>筛选条件</h6>
                <form class="row g-3">
                    <div class="col-md-3">
                        <label class="form-label small fw-semibold">业务类型</label>
                        <select class="form-select">
                            <option value="">全部业务</option>
                            <option>学生状态</option>
                            <option>异常单状态</option>
                            <option>续费状态</option>
                            <option>跟进阶段</option>
                            <option>课程状态</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold">业务ID</label>
                        <input type="text" class="form-control" placeholder="如: S001 / EX2024...">
                    </div>
                    <div class="col-md-2">
                        <label class="form-label small fw-semibold">操作人</label>
                        <select class="form-select">
                            <option value="">全部操作人</option>
                            <option>王老师</option>
                            <option>李老师</option>
                            <option>张老师</option>
                            <option>陈老师</option>
                            <option>系统自动</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label small fw-semibold">时间范围</label>
                        <div class="input-group">
                            <input type="date" class="form-control" value="2024-01-01">
                            <span class="input-group-text">至</span>
                            <input type="date" class="form-control" value="2024-01-15">
                        </div>
                    </div>
                    <div class="col-md-1 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-search"></i></button>
                    </div>
                </form>
            </div>
        </div>

        <div class="row g-4 mb-4">
            <div class="col-md-3">
                <div class="stat-card bg-primary text-white p-4 rounded-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-90">总变更记录</p>
                            <h3 class="fw-bold mb-0">2,847</h3>
                        </div>
                        <i class="bi bi-journal-text fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-success text-white p-4 rounded-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-90">今日变更</p>
                            <h3 class="fw-bold mb-0">156</h3>
                        </div>
                        <i class="bi bi-calendar-check fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-warning text-white p-4 rounded-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-90">人工操作</p>
                            <h3 class="fw-bold mb-0">1,923</h3>
                        </div>
                        <i class="bi bi-person-badge fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="stat-card bg-info text-white p-4 rounded-4 shadow-sm h-100">
                    <div class="d-flex justify-content-between align-items-center">
                        <div>
                            <p class="mb-1 opacity-90">系统自动</p>
                            <h3 class="fw-bold mb-0">924</h3>
                        </div>
                        <i class="bi bi-robot fs-2 opacity-75"></i>
                    </div>
                </div>
            </div>
        </div>

        <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body p-4">
                <h6 class="fw-bold mb-4"><i class="bi bi-clock-history text-primary me-2"></i>变更时间线</h6>
                <div class="position-relative">
                    <div th:each="log, iterStat : ${historyLogs ?: #lists.of({
                        {time:'2024-01-15 18:32:15', type:'异常单状态', bizId:'EX20240115001', old:'待处理', nw:'处理中', reason:'责任人陈老师已开始处理，正在联系家长了解情况', operator:'陈老师'},
                        {time:'2024-01-15 17:15:42', type:'续费跟进阶段', bizId:'S006-续费', old:'方案推荐', nw:'议价协商', reason:'家长对续费方案表示认可，进入价格协商阶段，希望给予更多优惠', operator:'王老师'},
                        {time:'2024-01-15 15:08:20', type:'学生状态', bizId:'S002', old:'在学', nw:'待续费', reason:'系统自动检测课程将于30天内到期，自动切换状态', operator:'系统自动'},
                        {time:'2024-01-15 14:30:00', type:'课程状态', bizId:'C008-物理', old:'开课中', nw:'已结课', reason:'课程周期结束，所有课时已消耗完毕，学员完成全部学习内容', operator:'李老师'},
                        {time:'2024-01-15 12:05:33', type:'异常单状态', bizId:'EX20240114005', old:'处理中', nw:'已解决', reason:'已联系学生家长，学生因感冒请假一周，现已恢复出勤学习', operator:'刘老师'},
                        {time:'2024-01-15 10:42:18', type:'续费状态', bizId:'S018-续费', old:'待续费', nw:'续费中', reason:'家长已口头确认续费意愿，等待正式签署续费协议并缴费', operator:'张老师'},
                        {time:'2024-01-15 09:00:00', type:'异常单状态', bizId:'EX20240115001', old:'-', nw:'待处理', reason:'系统自动检测：连续10天未登录学习平台，触发异常告警规则', operator:'系统自动'},
                        {time:'2024-01-14 20:18:55', type:'续费跟进阶段', bizId:'S012-续费', old:'初次接触', nw:'意向确认', reason:'初次沟通结束，家长表示对续报英语课程有较强兴趣', operator:'陈老师'}
                    })}" class="timeline-item pb-5">
                        <div class="row g-3">
                            <div class="col-md-2">
                                <div class="sticky-top" style="top: 1rem;">
                                    <p class="fw-bold text-primary mb-1" th:text="${#strings.substring(log.time, 0, 10)}">2024-01-15</p>
                                    <p class="text-muted small mb-0" th:text="${#strings.substring(log.time, 11)}">18:32:15</p>
                                </div>
                            </div>
                            <div class="col-md-10">
                                <div class="card border rounded-4 shadow-sm h-100">
                                    <div class="card-body">
                                        <div class="d-flex flex-wrap justify-content-between align-items-start mb-3">
                                            <div class="d-flex flex-wrap align-items-center gap-2 mb-2">
                                                <span class="badge bg-primary rounded-pill" th:text="${log.type}">异常单状态</span>
                                                <span class="badge bg-light text-dark border rounded-pill">
                                                    <i class="bi bi-hash me-1"></i>
                                                    <span th:text="${log.bizId}">EX20240115001</span>
                                                </span>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <span th:if="${log.operator == '系统自动'}" class="badge bg-secondary rounded-pill">
                                                    <i class="bi bi-robot me-1"></i>
                                                    <span th:text="${log.operator}">系统自动</span>
                                                </span>
                                                <span th:unless="${log.operator == '系统自动'}" class="badge bg-light text-dark border rounded-pill">
                                                    <i class="bi bi-person me-1"></i>
                                                    <span th:text="${log.operator}">陈老师</span>
                                                </span>
                                            </div>
                                        </div>
                                        <div class="d-flex flex-wrap align-items-center gap-3 mb-3 p-3 bg-light rounded-3">
                                            <div class="d-flex align-items-center">
                                                <span class="badge bg-secondary rounded-pill fs-6 px-3 py-2" th:text="${log.old}">待处理</span>
                                            </div>
                                            <div class="text-primary">
                                                <i class="bi bi-arrow-right fs-5"></i>
                                            </div>
                                            <div class="d-flex align-items-center">
                                                <span class="badge bg-success rounded-pill fs-6 px-3 py-2" th:text="${log.nw}">处理中</span>
                                            </div>
                                        </div>
                                        <div class="mb-0">
                                            <p class="small text-muted mb-1"><i class="bi bi-chat-left-text me-1"></i>变更原因</p>
                                            <p class="mb-0" th:text="${log.reason}">责任人陈老师已开始处理，正在联系家长了解情况</p>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="text-center mt-4">
                    <button class="btn btn-outline-primary px-4">
                        <i class="bi bi-arrow-down-circle me-1"></i>加载更多记录
                    </button>
                </div>
            </div>
        </div>

        <div th:insert="~{layout/fragments :: footer}"></div>
    </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
</body>
</html>
