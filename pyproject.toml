[project]
name = "pharmacy-followup-dashboard"
version = "0.1.0"
description = "药店连锁用药回访趋势看板"
requires-python = ">=3.10"
dependencies = [
    "streamlit>=1.37",
    "polars>=0.20",
    "duckdb>=1.0",
    "minio>=7.2",
    "plotly>=5.22",
    "pyyaml>=6.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "pillow>=10.3",
    "streamlit-authenticator>=0.3",
    "bcrypt>=5.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.5",
    "pytest>=8.2",
]
