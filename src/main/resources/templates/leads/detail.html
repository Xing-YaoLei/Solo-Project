<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('线索详情')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">客户线索详情</h3>
        <a th:href="@{/leads}" class="btn btn-outline-secondary">返回列表</a>
    </div>

    <div class="row">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">基本信息</div>
                <div class="card-body">
                    <table class="table table-sm">
                        <tr><th style="width:100px">客户姓名</th><td th:text="${lead.customerName}"></td></tr>
                        <tr><th>电话</th><td th:text="${lead.phone}"></td></tr>
                        <tr><th>微信号</th><td th:text="${lead.wechatId}"></td></tr>
                        <tr><th>意向车型</th><td th:text="${lead.intendedVehicle}"></td></tr>
                        <tr><th>需求</th><td th:text="${lead.requirements}"></td></tr>
                        <tr><th>状态</th>
                            <td><span class="status-badge" th:class="'lead-status-' + ${lead.status.name()}" th:text="${lead.status.name()}"></span></td>
                        </tr>
                        <tr><th>来源</th><td th:text="${lead.source?.name()}"></td></tr>
                        <tr><th>负责人</th><td th:text="${lead.owner?.realName}"></td></tr>
                        <tr><th>备注</th><td th:text="${lead.remark}"></td></tr>
                        <tr><th>创建时间</th><td th:text="${#temporals.format(lead.createTime, 'yyyy-MM-dd HH:mm')}"></td></tr>
                    </table>
                    <div class="mt-3">
                        <a th:href="@{/leads/edit/{id}(id=${lead.id})}" class="btn btn-outline-primary btn-sm">编辑</a>
                        <a th:href="@{/scheduler/new(leadId=${lead.id})}" class="btn btn-outline-success btn-sm">创建试驾预约</a>
                        <a th:href="@{/records/lead/{id}(id=${lead.id})}" class="btn btn-outline-info btn-sm">试驾历史</a>
                    </div>
                </div>
            </div>
        </div>

        <div class="col-md-6">
            <div class="card">
                <div class="card-header d-flex justify-content-between align-items-center">
                    <span>变更记录</span>
                    <a th:href="@{/leads/{id}/history(id=${lead.id})}" class="btn btn-sm btn-outline-secondary">查看全部</a>
                </div>
                <div class="card-body">
                    <div th:if="${#lists.isEmpty(changeLogs)}" class="text-center text-muted py-4">暂无变更记录</div>
                    <div th:each="log, iter : ${changeLogs}" th:if="${iter.index lt 10}" class="change-log-item">
                        <div class="d-flex justify-content-between">
                            <span class="change-log-field" th:text="${log.fieldName}"></span>
                            <span class="text-muted small" th:text="${#temporals.format(log.createTime, 'yyyy-MM-dd HH:mm')}"></span>
                        </div>
                        <div class="small">
                            <span class="change-log-old" th:text="${log.oldValue}"></span>
                            <span class="mx-2">&rarr;</span>
                            <span class="change-log-new" th:text="${log.newValue}"></span>
                        </div>
                        <div class="small text-muted mt-1">
                            操作人: <span th:text="${log.operator?.realName} ?: '系统'"></span>
                            <span th:if="${log.changeReason}" th:text="' | ' + ${log.changeReason}"></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
