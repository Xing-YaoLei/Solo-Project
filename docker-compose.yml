version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: scenic-postgres
    restart: always
    environment:
      POSTGRES_USER: scenic_admin
      POSTGRES_PASSWORD: scenic_password_2024
      POSTGRES_DB: scenic_operation
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: scenic-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  redis_data:
