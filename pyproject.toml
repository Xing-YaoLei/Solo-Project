[tool.poetry]
name = "beauty-customer-dashboard"
version = "0.1.0"
description = "美业门店顾客回访趋势看板"
authors = ["Your Name <you@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
streamlit = "1.35.0"
polars = "1.3.0"
duckdb = "1.0.0"
minio = "7.2.7"
pandas = "2.2.2"
numpy = "1.26.4"
plotly = "5.22.0"
altair = "5.3.0"
python-dotenv = "1.0.1"
pydantic = "2.7.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ['py310']

[tool.ruff]
line-length = 120
target-version = "py310"
