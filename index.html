<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>票务经营模拟大师</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #1a1a2e;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    }
    #GameCanvas {
        display: block;
        width: 100%;
        width: 100vw;
        height: 100%;
        height: 100vh;
        margin: 0;
        padding: 0;
    }
    #Cocos3dGameContainer, #GameDiv {
        width: 100%;
        height: 100%;
    }
    .loading {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        color: white;
        z-index: 9999;
        transition: opacity 0.5s ease;
    }
    .loading.hidden {
        opacity: 0;
        pointer-events: none;
    }
    .loading-logo {
        font-size: 48px;
        margin-bottom: 20px;
        animation: pulse 1.5s ease-in-out infinite;
    }
    .loading-title {
        font-size: 32px;
        font-weight: bold;
        margin-bottom: 30px;
        text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    }
    .loading-bar {
        width: 300px;
        height: 8px;
        background: rgba(255,255,255,0.2);
        border-radius: 4px;
        overflow: hidden;
    }
    .loading-progress {
        height: 100%;
        background: linear-gradient(90deg, #ffd700, #ff8c00);
        border-radius: 4px;
        animation: loading 2s ease-in-out forwards;
    }
    .loading-text {
        margin-top: 15px;
        font-size: 14px;
        opacity: 0.8;
    }
    @keyframes pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }
    @keyframes loading {
        0% { width: 0%; }
        100% { width: 100%; }
    }
    .info-panel {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255,255,255,0.6);
        font-size: 12px;
        text-align: center;
        white-space: nowrap;
        z-index: 100;
        pointer-events: none;
    }
</style>
</head>
<body>
    <div class="loading" id="loading">
        <div class="loading-logo">🎫</div>
        <div class="loading-title">票务经营模拟大师</div>
        <div class="loading-bar">
            <div class="loading-progress"></div>
        </div>
        <div class="loading-text">正在加载游戏资源...</div>
        <div class="info-panel">
            Cocos Creator | TypeScript | 触屏与键盘操作兼容 | 支持工作间隙安静练习模式
        </div>
    </div>
    <div id="GameDiv"></div>

<script type="text/javascript">
        setTimeout(() => {
            const loading = document.getElementById('loading');
            if (loading) {
                loading.classList.add('hidden');
                setTimeout(() => loading.remove(), 600);
            }
        }, 2500);
    </script>

<script src="src/settings.js" charset="utf-8"></script>
<script src="cocos2d-js-min.js" charset="utf-8"></script>
<script src="main.js" charset="utf-8"></script>
<script src="application.js" charset="utf-8"></script>
<script>
    console.log('%c🎫 票务经营模拟大师', 'font-size: 24px; color: #ffd700; font-weight: bold;');
    console.log('%c活动票务演出票务经营模拟游戏已启动', 'font-size: 14px; color: #3498db;');
    console.log('%c快捷键: [空格]确认 [R]拒绝 [S]推荐 [C]清空 [ESC]暂停', 'color: #2ecc71;');
</script>

</body>
</html>
