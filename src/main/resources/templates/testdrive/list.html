<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout}"
      lang="zh-CN">
<head>
  <title>试驾记录</title>
</head>
<body>
<div layout:fragment="content">

  <div class="page-header">
    <h1 class="page-header__title">试驾记录</h1>
  </div>

  <div class="alert alert--danger" th:if="${error}" th:text="${error}"></div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">筛选条件</h2>
    </div>
    <div class="card__body">
      <form class="form form--inline" th:action="@{/test-drives}" method="get">
        <div class="form-group" th:if="${vehicles != null}">
          <label class="form-group__label" for="vehicleId">选择车辆</label>
          <select class="form-group__input" id="vehicleId" name="vehicleId">
            <option value="">全部车辆</option>
            <option th:each="v : ${vehicles}" th:value="${v.id}" th:selected="${selectedVehicleId != null and selectedVehicleId == v.id}" th:text="${v.vin + ' - ' + v.brand + ' ' + v.model}">车辆</option>
          </select>
        </div>
        <div class="form-group" th:unless="${vehicles != null}">
          <label class="form-group__label" for="vehicleId">车辆ID</label>
          <input class="form-group__input" type="text" id="vehicleId" name="vehicleId"
                 th:value="${selectedVehicleId != null ? selectedVehicleId : ''}" placeholder="车辆ID">
        </div>
        <div class="form-group">
          <button type="submit" class="btn btn--primary">搜索</button>
          <a class="btn btn--secondary" th:href="@{/test-drives}">重置</a>
        </div>
      </form>
    </div>
  </div>

  <div class="card" th:if="${currentRole == 'SALES' or currentRole == 'MANAGER'}">
    <div class="card__header">
      <h2 class="card__title">新增试驾记录</h2>
      <button type="button" class="btn btn--sm btn--secondary" onclick="this.closest('.card').querySelector('.card__body--collapsible').classList.toggle('card__body--hidden')">展开/收起</button>
    </div>
    <div class="card__body card__body--collapsible card__body--hidden">
      <form class="form" th:action="@{/test-drives}" method="post">
        <div class="grid grid--3">
          <div class="form-group">
            <label class="form-group__label" for="customerName">客户姓名</label>
            <input class="form-group__input" type="text" id="customerName" name="customerName" required>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="customerPhone">客户电话</label>
            <input class="form-group__input" type="text" id="customerPhone" name="customerPhone" required>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="driveDate">试驾日期</label>
            <input class="form-group__input" type="date" id="driveDate" name="driveDate" required>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="mileageBefore">试驾前里程</label>
            <input class="form-group__input" type="number" id="mileageBefore" name="mileageBefore" step="1" required>
          </div>
          <div class="form-group">
            <label class="form-group__label" for="mileageAfter">试驾后里程</label>
            <input class="form-group__input" type="number" id="mileageAfter" name="mileageAfter" step="1" required>
          </div>
        </div>
        <div class="form-group">
          <label class="form-group__label" for="feedback">客户反馈</label>
          <textarea class="form-group__input" id="feedback" name="feedback" rows="3"></textarea>
        </div>
        <div class="form-group" th:if="${selectedVehicleId == null and vehicles != null}">
          <label class="form-group__label" for="vehicleId">选择车辆</label>
          <select class="form-group__input" id="vehicleId" name="vehicleId" required>
            <option value="">请选择</option>
            <option th:each="v : ${vehicles}" th:value="${v.id}" th:text="${v.vin + ' - ' + v.brand + ' ' + v.model}">车辆</option>
          </select>
        </div>
        <div class="form-group" th:if="${selectedVehicleId == null and vehicles == null}">
          <label class="form-group__label" for="vehicleId">车辆ID</label>
          <input class="form-group__input" type="number" id="vehicleId" name="vehicleId" required>
        </div>
        <input type="hidden" name="vehicleId" th:if="${selectedVehicleId != null}" th:value="${selectedVehicleId}">
        <input type="hidden" name="operatorId" th:value="${currentUserId}">
        <button type="submit" class="btn btn--primary">提交</button>
      </form>
    </div>
  </div>

  <div class="card">
    <div class="card__header">
      <h2 class="card__title">试驾记录列表</h2>
    </div>
    <div class="card__body">
      <table class="table" th:if="${records != null and !records.isEmpty()}">
        <thead>
          <tr>
            <th>车辆信息</th>
            <th>客户</th>
            <th>试驾日期</th>
            <th>里程范围</th>
            <th>客户反馈</th>
            <th>销售</th>
            <th>创建时间</th>
          </tr>
        </thead>
        <tbody>
          <tr th:each="r : ${records}">
            <td>
              <a th:href="@{/vehicles/{id}(id=${r.vehicleId})}" th:text="${r.vehicleInfo}">车辆</a>
            </td>
            <td th:text="${r.customerName}">客户</td>
            <td th:text="${r.driveDate}">日期</td>
            <td th:text="${r.mileageBefore + ' ~ ' + r.mileageAfter}">里程</td>
            <td th:text="${r.feedback}">反馈</td>
            <td th:text="${r.salesName}">销售</td>
            <td th:text="${#temporals.format(r.createdAt, 'yyyy-MM-dd HH:mm')}">时间</td>
          </tr>
        </tbody>
      </table>

      <div th:if="${records == null or records.isEmpty()}">
        <div th:replace="~{fragments/common :: emptyState('暂无试驾记录')}"></div>
      </div>
    </div>
  </div>

  <div th:replace="~{fragments/common :: pagination(${records})}"></div>

</div>
</body>
</html>
