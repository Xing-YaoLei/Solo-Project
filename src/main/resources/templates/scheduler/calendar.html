<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head>
    <th:block th:insert="~{fragments/layout :: head('预约排程 - 二手车试驾预约系统')}"></th:block>
</head>
<body>
<div th:insert="~{fragments/layout :: navbar}"></div>
<div th:insert="~{fragments/layout :: alerts}"></div>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h3 class="section-title">试驾预约排程台</h3>
        <a th:href="@{/scheduler/new}" class="btn btn-primary">
            <i class="bi bi-plus"></i> 新增预约
        </a>
    </div>

    <div class="card">
        <div class="card-header d-flex justify-content-between align-items-center">
            <div class="btn-group">
                <a th:href="@{/scheduler(date=${currentDate.minusDays(1)})}" class="btn btn-outline-secondary btn-sm">&larr; 前一天</a>
                <span class="btn btn-secondary btn-sm disabled" th:text="${currentDate}"></span>
                <a th:href="@{/scheduler(date=${currentDate.plusDays(1)})}" class="btn btn-outline-secondary btn-sm">后一天 &rarr;</a>
            </div>
            <a th:href="@{/scheduler/search}" class="btn btn-outline-primary btn-sm">高级搜索</a>
        </div>
        <div class="card-body">
            <div class="row">
                <div class="col-md-12" th:each="hour : ${#numbers.sequence(9, 18)}">
                    <div class="time-slot">
                        <div class="time-slot-header" th:text="${hour} + ':00 - ' + ${hour + 1} + ':00'"></div>
                        <div class="row">
                            <div class="col" th:each="appt : ${appointments.?[appointmentTime.getHour() eq __${hour}__]}">
                                <div class="appointment-card"
                                     th:classappend="${appt.status.name() == 'COMPLETED'} ? 'completed' : (${appt.status.name() == 'NO_SHOW'} ? 'no-show' : '')">
                                    <div class="d-flex justify-content-between">
                                        <strong th:text="${appt.customerName}"></strong>
                                        <span class="status-badge"
                                              th:class="'status-' + ${appt.status.name()}"
                                              th:text="${appt.status.name()}"></span>
                                    </div>
                                    <div class="text-muted" th:text="${appt.vehicleName}"></div>
                                    <div class="text-muted small">
                                        <span th:if="${appt.salesConsultant != null}" th:text="'销售: ' + ${appt.salesConsultant.realName}"></span>
                                    </div>
                                    <div class="mt-2">
                                        <a th:href="@{/scheduler/edit/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-primary">编辑</a>
                                        <a th:href="@{/records/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-info">记录</a>
                                        <a th:if="${appt.status.name() == 'SCHEDULED' or appt.status.name() == 'CONFIRMED'}"
                                           th:href="@{/scheduler/complete/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-success">完成</a>
                                        <a th:if="${appt.status.name() == 'SCHEDULED' or appt.status.name() == 'CONFIRMED'}"
                                           th:href="@{/scheduler/no-show/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-danger"
                                           onclick="return confirm('确定标记为爽约吗？')">爽约</a>
                                        <a th:if="${appt.status.name() != 'COMPLETED' and appt.status.name() != 'CANCELLED' and appt.status.name() != 'NO_SHOW'}"
                                           th:href="@{/scheduler/cancel/{id}(id=${appt.id})}" class="btn btn-sm btn-outline-warning"
                                           onclick="return confirm('确定取消预约吗？')">取消</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:insert="~{fragments/layout :: footer}"></div>
</body>
</html>
