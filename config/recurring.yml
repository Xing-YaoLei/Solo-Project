development:
  refund_dispute_reminder:
    cron: "0 10 * * *"
    class: "RefundDisputeReminderJob"
    queue: default
    args: []
    description: "每日上午10点催办超过24小时未处理的退票争议"

  monthly_check_in_report:
    cron: "0 2 1 * *"
    class: "MonthlyReportJob"
    queue: low_priority
    args: []
    description: "每月1日凌晨2点生成上月核销效率报表"

