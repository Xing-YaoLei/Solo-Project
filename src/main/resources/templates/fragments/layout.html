<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="zh-CN">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title}">二手车门店试驾预约系统</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/}">二手车试驾预约系统</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav">
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/scheduler}" th:classappend="${#httpServletRequest.requestURI.startsWith('/scheduler')} ? 'active'">
                        预约排程
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/records}" th:classappend="${#httpServletRequest.requestURI.startsWith('/records')} ? 'active'">
                        试驾记录
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/leads}" th:classappend="${#httpServletRequest.requestURI.startsWith('/leads')} ? 'active'">
                        客户线索
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/no-show}" th:classappend="${#httpServletRequest.requestURI.startsWith('/no-show')} ? 'active'">
                        爽约处理
                    </a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" th:href="@{/review}" th:classappend="${#httpServletRequest.requestURI.startsWith('/review')} ? 'active'">
                        月底复盘
                    </a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<div th:fragment="alerts" class="container mt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert">
        <span th:text="${success}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert">
        <span th:text="${error}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
</div>

<div th:fragment="footer" class="footer mt-5 py-3 bg-light">
    <div class="container text-center text-muted">
        <small>二手车门店试驾预约排程系统 &copy; 2026</small>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
