<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 青少年培训续费跟进排程台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
        }
    </style>
</head>
<body>

<div class="login-container px-4">
    <div class="login-card">
        <div class="text-center mb-5">
            <div class="bg-white bg-opacity-20 rounded-4 p-4 d-inline-block mb-4">
                <svg xmlns="http://www.w3.org/2000/svg" width="56" height="56" fill="white" viewBox="0 0 16 16">
                    <path d="M8.211 2.047a.5.5 0 0 0-.422 0l-7.5 3.5a.5.5 0 0 0 .025.917l7.5 3a.5.5 0 0 0 .372 0l7.5-3a.5.5 0 0 0 .025-.917l-7.5-3.5Z"/>
                    <path d="M4.176 9.032a.5.5 0 0 0-.656.327l-.5 1.7a.5.5 0 0 0 .294.605l4.5 1.8a.5.5 0 0 0 .372 0l4.5-1.8a.5.5 0 0 0 .294-.605l-.5-1.7a.5.5 0 0 0-.656-.327L8 10.466 4.176 9.032Zm-.068 1.873c.21-.187.436-.374.672-.566a.5.5 0 0 1 .294.605l-.5 1.7a.5.5 0 0 1-.294.605l-1.35.54a.5.5 0 1 1-.372-.928l1.55-.62.5-1.7Z"/>
                </svg>
            </div>
            <h2 class="fw-bold text-white mb-2">青少年培训续费跟进排程台</h2>
            <p class="text-white opacity-75 mb-0">高效管理学生续费与学习跟进</p>
        </div>

        <div class="card border-0 shadow-lg rounded-4">
            <div class="card-body p-5">
                <h3 class="fw-bold text-center mb-4">欢迎登录</h3>
                <form th:action="@{/login}" method="post">
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-person me-1"></i>用户名
                        </label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-person text-muted"></i>
                            </span>
                            <input type="text" name="username" class="form-control border-start-0 bg-light"
                                   placeholder="请输入用户名" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold">
                            <i class="bi bi-lock me-1"></i>密码
                        </label>
                        <div class="input-group input-group-lg">
                            <span class="input-group-text bg-light border-end-0">
                                <i class="bi bi-lock text-muted"></i>
                            </span>
                            <input type="password" name="password" class="form-control border-start-0 bg-light"
                                   placeholder="请输入密码" required>
                            <button type="button" class="btn btn-light border-start-0 border"
                                    onclick="togglePassword()">
                                <i class="bi bi-eye text-muted" id="pwdIcon"></i>
                            </button>
                        </div>
                    </div>
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="rememberMe">
                            <label class="form-check-label small text-muted" for="rememberMe">记住我</label>
                        </div>
                        <a href="#" class="small text-primary text-decoration-none">忘记密码？</a>
                    </div>
                    <div class="d-grid mb-4">
                        <button type="submit" class="btn btn-primary btn-lg py-3 rounded-3 fw-semibold">
                            <i class="bi bi-box-arrow-in-right me-2"></i>登 录
                        </button>
                    </div>
                </form>

                <div class="text-center">
                    <p class="small text-muted mb-0">
                        还没有账号？
                        <a href="#" class="text-primary text-decoration-none fw-semibold">联系管理员开通</a>
                    </p>
                </div>
            </div>
            <div class="card-footer bg-transparent border-0 px-5 pb-5 text-center">
                <p class="small text-muted mb-0">
                    &copy; 2024 青少年培训续费跟进排程台 &nbsp;|&nbsp; Version 1.0.0
                </p>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script th:src="@{/js/app.js}"></script>
<script>
    function togglePassword() {
        const pwdInput = document.querySelector('input[name="password"]');
        const pwdIcon = document.getElementById('pwdIcon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            pwdIcon.classList.remove('bi-eye');
            pwdIcon.classList.add('bi-eye-slash');
        } else {
            pwdInput.type = 'password';
            pwdIcon.classList.remove('bi-eye-slash');
            pwdIcon.classList.add('bi-eye');
        }
    }
</script>
</body>
</html>
