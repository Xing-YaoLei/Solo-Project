server:
  port: 8081
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true

spring:
  application:
    name: usedcar-dashboard

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/usedcar_dashboard?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password:
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  data:
    redis:
      host: localhost
      port: 6379
      database: 0
      timeout: 5000
      lettuce:
        pool:
          max-active: 16
          max-idle: 8
          min-idle: 4
          max-wait: 3000

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false

mybatis:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.usedcar.dashboard.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: true
    lazy-loading-enabled: true
    multiple-result-sets-enabled: true

dashboard:
  cache:
    ttl-seconds: 300
    vehicle-trend-key: dashboard:vehicleTrend
    inspection-key: dashboard:inspectionReport
    prep-key: dashboard:prepList
    testdrive-key: dashboard:testDriveAnomaly
    overview-key: dashboard:overview
  export:
    temp-dir: ${java.io.tmpdir}/dashboard-exports
  share:
    default-expire-days: 7

logging:
  level:
    root: INFO
    com.usedcar.dashboard: DEBUG
    org.mybatis: DEBUG
